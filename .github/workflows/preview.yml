# Fix: fix-2 — Preview deploy voor fix-branches naar GitHub Pages submap
name: Preview deploy fix-branch

on:
  push:
    branches:
      - 'fix-*'

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix-branch
        uses: actions/checkout@v4

      - name: Bepaal fixnummer
        id: fixnr
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Zet preview-bestanden klaar
        run: |
          BRANCH="${{ steps.fixnr.outputs.branch }}"
          mkdir -p /tmp/preview/$BRANCH
          # Kopieer de hele repo root (index.html + eventuele assets)
          cp -r . /tmp/preview/$BRANCH/
          rm -rf /tmp/preview/$BRANCH/.git
          rm -rf /tmp/preview/$BRANCH/.github

      - name: Checkout gh-pages-preview (maak aan als die er niet is)
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          BRANCH="${{ steps.fixnr.outputs.branch }}"
          # Haal gh-pages-preview op of maak hem aan
          git fetch origin gh-pages-preview 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages-preview; then
            git checkout gh-pages-preview
          else
            git checkout --orphan gh-pages-preview
            git rm -rf . --quiet || true
            echo "# Preview branch" > README.md
            git add README.md
            git commit -m "init gh-pages-preview"
          fi
          # Verwijder oude versie van deze fix en zet nieuwe neer
          rm -rf "$BRANCH"
          cp -r /tmp/preview/$BRANCH .
          # Update index met links naar alle fix-previews
          {
            echo "<!DOCTYPE html><html lang='nl'><head><meta charset='utf-8'>"
            echo "<title>MuziekApp previews</title>"
            echo "<style>body{font-family:sans-serif;padding:2rem}a{display:block;margin:.5rem 0}</style>"
            echo "</head><body><h1>MuziekApp fix-previews</h1>"
            for d in fix-*/; do
              d="${d%/}"
              echo "<a href='$d/'>$d</a>"
            done
            echo "</body></html>"
          } > index.html
          git add -A
          git commit -m "$BRANCH: preview update" || echo "Niets te committen"
          git push origin gh-pages-preview
